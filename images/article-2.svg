<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Readable technical writing illustration</title>
  <desc id="desc">A clean editor layout showing headings, bullet points, task lists, and a sample code block.</desc>
  <rect width="1200" height="600" fill="#f6faff"/>
  <rect x="80" y="70" width="1040" height="460" rx="28" fill="#ffffff" stroke="#dfeaf8" stroke-width="3"/>
  <rect x="120" y="110" width="220" height="360" rx="22" fill="#edf4ff"/>
  <rect x="170" y="150" width="120" height="18" rx="9" fill="#4f81bd"/>
  <rect x="170" y="190" width="90" height="12" rx="6" fill="#c7d8ef"/>
  <rect x="170" y="220" width="110" height="12" rx="6" fill="#c7d8ef"/>
  <rect x="170" y="250" width="95" height="12" rx="6" fill="#c7d8ef"/>
  <rect x="170" y="300" width="120" height="18" rx="9" fill="#79a96d"/>
  <rect x="170" y="340" width="100" height="12" rx="6" fill="#dbead9"/>
  <rect x="390" y="120" width="640" height="230" rx="22" fill="#f9fbff" stroke="#dfeaf8" stroke-width="2"/>
  <text x="430" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="32" fill="#244d75" font-weight="700">Write for the task</text>
  <text x="430" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#4a5d75">• start with the outcome</text>
  <text x="430" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#4a5d75">• break steps into clear actions</text>
  <text x="430" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#4a5d75">• use examples that match the reader</text>
  <rect x="390" y="380" width="640" height="70" rx="18" fill="#1f2d3d"/>
  <text x="430" y="425" font-family="Consolas, monospace" font-size="22" fill="#dfeeff">quarto render</text>
</svg>
